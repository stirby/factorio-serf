[project]
name = "factorio-serf"
version = "0.1.0"
description = "Serf: an AI teammate that plays Factorio next to you (the app for the factorio-serf mod)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]  # backend = "openai": OpenAI-compatible providers (Vercel AI Gateway, DeepSeek, ...)

[project.scripts]
crew = "crew.cli:main"
serf = "crew.cli:serf_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crew"]
