[project]
name = "claude-crew"
version = "0.1.0"
description = "Claude agents as Factorio players: orchestrator for the claude-crew mod"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "claude-agent-sdk>=0.1",
]

[project.scripts]
crew = "crew.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crew"]
