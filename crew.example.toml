# Copy to crew.toml. Everything model-related is here.
# Top-level keys go before the first [table].
# spawn_near = "otterplex"    # spawn agents next to this player if they're online
# starter_kit = true          # the freeplay starting items (burner drill, furnace, 8 plates...)
# state_dir = "~/.local/state/claude-crew"   # board, notes, copies; use one per world

[server]
host = "127.0.0.1"
rcon_port = 27015
# rcon_password = "..."                       # or FACTORIO_RCON_PASSWORD, or:
rcon_password_file = "server/rcon-password"   # relative to this file

# Your player: one character in the game, driven by one model. Talk to it in chat.
[defaults]
backend = "claude-code"       # "claude-code" = your Claude Code login (subscription); "api" = ANTHROPIC_API_KEY
model = "claude-sonnet-5-5"   # or "claude-opus-5-5": slower and pricier, better judgment
# effort = "medium"           # low | medium | high
max_turns_per_hour = 120

# Hard cap on spend over the trailing hour; the agent pauses when it's reached.
# [budget]
# usd_per_hour = 25

[[agent]]
name = "claude-1"
personality = "Calm, dry humor, likes tidy layouts."

# The model can also come from an OpenAI-compatible provider, e.g. DeepSeek through the Vercel AI Gateway.
# Keys go in ~/.config/claude-crew/env (KEY=VALUE, chmod 600), never in this file:
#   AI_GATEWAY_API_KEY=...
# and in [[agent]]: backend = "openai", base_url = "https://ai-gateway.vercel.sh/v1",
#   model = "deepseek/deepseek-v4.1-flash-1017"

# The paused multi-agent crew (an Opus foreman directing several workers): docs/crew-design.md.
