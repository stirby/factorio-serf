# Copy to crew.toml. Everything model-related is here so switching to Opus for a demo is one line.

[server]
host = "127.0.0.1"
rcon_port = 27015
# rcon_password = "..."                       # or FACTORIO_RCON_PASSWORD, or:
rcon_password_file = "server/rcon-password"   # relative to this file

# spawn_near = "otterplex"    # spawn agents next to this player if they're online
# starter_kit = true          # the freeplay starting items (burner drill, furnace, 8 plates...)

[defaults]
backend = "claude-code"       # "claude-code" = your Claude Code login (subscription); "api" = ANTHROPIC_API_KEY
model = "claude-sonnet-5-5"   # demo: "claude-opus-5-5"
# effort = "medium"           # low | medium | high
max_turns_per_hour = 120

# Optional: the foreman's right hand. No character; consulted for designs/ratios/plans; can post board tasks.
[advisor]
name = "architect"
model = "claude-opus-5-5"
effort = "high"

[[agent]]
name = "claude-1"
role = "foreman"
personality = "Calm, dry humor, likes tidy layouts."

[[agent]]
name = "claude-2"
personality = "Eager, efficient, a little competitive about throughput."

# Optional characterless lead. Workers ask it with ask_foreman and keep building; it answers in batches,
# owns the roadmap and board, and takes human chat that isn't addressed to one worker ("@foreman ...").
# [foreman]
# name = "foreman"
# model = "claude-opus-5-5"
# effort = "medium"

# Any agent (or [foreman]) can run on an OpenAI-compatible provider instead of Claude, e.g. DeepSeek through the
# Vercel AI Gateway. Keys go in ~/.config/claude-crew/env (KEY=VALUE, chmod 600), never in this file:
#   AI_GATEWAY_API_KEY=...        (the gateway default; set api_key_env to use another variable)
# Cost is computed from the gateway's price list (US regional prices when listed).
# [[agent]]
# name = "claude-4"
# backend = "openai"
# base_url = "https://ai-gateway.vercel.sh/v1"
# model = "deepseek/deepseek-v4-pro"       # or deepseek/deepseek-v4.1-flash-1017 (cheaper)
# # api_key_env = "AI_GATEWAY_API_KEY"
